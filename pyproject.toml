# Build configuration.
[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

# Package metadata and runtime dependencies.
[project]
name = "pbp"
version = "0.1.0"
description = "Pokémon Battles Prediction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eva", email = "eva.evangelisti03@gmail.com" }]
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

# Development dependencies.
[dependency-groups]
docs = [
    "myst-parser>=5.1.0",
    "shibuya>=2026.7.12",
    "sphinx>=9.1.0",
]

lint = [
    "ruff>=0.16.2",
]

typing = [
    "basedpyright>=1.39.9",
    "pandas-stubs>=3.1.0.261029",
    "scikit-learn-stubs>=0.0.3",
]

# Formatting and linting.
[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle, errors
    "ERA",   # eradicate
    "EXE",   # flake8-executable
    "F",     # Pyflakes
    "FBT",   # flake8-boolean-trap
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PLC",   # Pylint, conventions
    "PLE",   # Pylint, errors
    "PLW",   # Pylint, warnings
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "SLOT",  # flake8-slots
    "T20",   # flake8-print
    "UP",    # pyupgrade
    "W",     # pycodestyle, warnings
    "YTT",   # flake8-2020
]

ignore = [
    "D200",    # A docstring is written across three lines, however short.
    "D212",    # Its summary opens on the line below the quotes.
    "PLC0415", # A format is imported where it is built, not before.
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

# Strict type checking against the supported Python version.
[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
